[project]
name = "contextdrift"
version = "0.1.0"
description = "Cross-channel Slack memory sentinel on Cognee's knowledge graph and Qdrant vector search"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Adapter 0.4.0 still declares cognee==1.4.2. Empirically it round-trips
    # remember/recall on 1.5.0.dev1 (VectorDBInterface and registration hooks
    # survived). The uv override below is what defeats the declared pin.
    "cognee==1.5.0.dev1",
    "cognee-community-vector-adapter-qdrant==0.4.0",
    "qdrant-client>=1.19.0",
    # The upper bound matters: cognee asks for openai>=1.80.1 unbounded, which lets
    # a resolver pull 3.x into a tree pinned to litellm 1.89.2. The floor is set by
    # litellm 1.89.2 itself, which requires openai>=2.20.0.
    "openai>=2.20.0,<3.0.0",
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-dotenv>=1.2.2",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-xdist>=3.8.0",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
override-dependencies = ["cognee==1.5.0.dev1"]

[tool.hatch.build.targets.wheel]
packages = ["src/contextdrift"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q -n 2"
