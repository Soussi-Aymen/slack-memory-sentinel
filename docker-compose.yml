services:
  qdrant:
    image: qdrant/qdrant:v1.19.0-unprivileged
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:uid=1000,gid=1000
      - /qdrant/snapshots:uid=1000,gid=1000
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      # The qdrant image ships no curl or wget, so /readyz is probed through
      # bash's own /dev/tcp. Ports stay on the compose network; do not publish.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    # Root only for entrypoint chown of existing named volumes, then uid 1000.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Must be set before Cognee imports: 1.5 defaults to multi-tenant auth,
      # which would hide the existing single-user "slack" dataset.
      ENABLE_BACKEND_ACCESS_CONTROL: "false"
      HOME: /home/app
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./frontend:/app/frontend:ro
      - ./data:/app/data:ro
      - cognee_system:/app/.cognee_system
      - cognee_data:/app/.data_storage
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  cognee_system:
  cognee_data:
