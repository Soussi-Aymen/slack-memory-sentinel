services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      # The qdrant image ships no curl or wget, so /readyz is probed through
      # bash's own /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333 &&
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '200 OK' <&3
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./backend/src:/app/src
      - ./backend/tests:/app/tests
      - ./frontend:/app/frontend:ro
      - ./data:/app/data:ro
      - cognee_system:/app/.cognee_system
      - cognee_data:/app/.data_storage
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  cognee_system:
  cognee_data:
