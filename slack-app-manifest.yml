# Slack app manifest for the Cognee Slack integration (Path A).
#
# Goal: /cognee-ask in Slack hits this backend. Nothing is generated by
# Cognee until the workspace is connected. You fill secrets; then chat.
#
# ── One-time tools ────────────────────────────────────────────────────────
#   ngrok     https://ngrok.com/download   (free account → one HTTPS tunnel)
#   Slack app https://api.slack.com/apps   (Create New App → From a manifest)
#
# ── Steps ─────────────────────────────────────────────────────────────────
# 1. Backend already on :8000. In a second terminal:
#      ngrok http 8000
#    Copy the hostname only, e.g. abc123.ngrok-free.app
#    (from the https:// forwarding URL; no https:// prefix).
#
# 2. In this file replace every YOUR_NGROK_HOST with that hostname.
#
# 3. https://api.slack.com/apps → Create New App → From an app manifest
#    → pick your scratch workspace → paste this YAML → Create.
#    Then Install App (or you will do that from http://localhost:8000/integrations).
#
# 4. Still on that app page, open Basic Information. Copy into repo-root .env:
#
#      .env key                  Slack UI (Basic Information)
#      SLACK_CLIENT_ID           App Credentials → Client ID
#      SLACK_CLIENT_SECRET       App Credentials → Client Secret  (Show)
#      SLACK_SIGNING_SECRET      App Credentials → Signing Secret (Show)
#
# 5. Same .env, set the two URLs and the local encryption key:
#
#      SLACK_REDIRECT_URI=https://YOUR_NGROK_HOST/api/v1/integrations/slack/callback
#        (must match oauth_config.redirect_urls below, byte-for-byte)
#
#      SLACK_FRONTEND_BASE_URL=http://localhost:8000
#        (browser return after OAuth — localhost, not ngrok)
#
#      INTEGRATION_CREDENTIALS_KEY=<output of>
#        python3 -c "import os,base64; print(base64.b64encode(os.urandom(32)).decode())"
#        (not from Slack; encrypts the workspace token on disk)
#
# 6. docker compose up -d --build
#    Open http://localhost:8000/integrations — every pill must say "set".
#    Click Connect Slack, allow the app in the workspace.
#
# 7. In Slack: /cognee-link (open the private link once), then
#      /cognee-ask was the checkout 504 bug fixed?
#
# If ngrok restarts, the hostname changes. Repeat 2–3 (update the manifest
# URLs in Slack: Slash Commands, Interactivity, Event Subscriptions, OAuth
# Redirect URLs) and update SLACK_REDIRECT_URI, then restart the backend.

display_information:
  name: Cognee
  description: Ask questions, save messages, and recall your team's shared memory — right from Slack.
  long_description: >-
    Cognee turns your Slack workspace into a front door for your team's knowledge
    graph. Ask it a question with /cognee-ask and get an answer pulled straight
    from what your team already knows — reviewed privately before anything is
    shared with the channel. Save an important message to memory in one click
    with the "Remember this" shortcut. Every teammate links their own Cognee
    account with /cognee-link, so answers and saved messages are always
    personal, never mixed up with someone else's.
  background_color: "#6510F4"

features:
  bot_user:
    display_name: cognee
    always_online: true
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
  slash_commands:
    - command: /cognee-ask
      url: https://YOUR_NGROK_HOST/api/v1/slack/commands
      description: Ask your Cognee memory a question — reviewed privately before you share it
      usage_hint: what do we know about the Q3 launch?
    - command: /cognee-remember
      url: https://YOUR_NGROK_HOST/api/v1/slack/commands
      description: Save a decision or fact worth keeping — for things Slack never saw
      usage_hint: we chose Neon for v2, branching is cheaper
    - command: /cognee-link
      url: https://YOUR_NGROK_HOST/api/v1/slack/commands
      description: Get a private link to connect this Slack account to your own Cognee memory
  shortcuts:
    - name: Remember this
      type: message
      callback_id: remember_this
      description: Save this message to your own Cognee memory, tagged with who said it and where

oauth_config:
  redirect_urls:
    - https://YOUR_NGROK_HOST/api/v1/integrations/slack/callback
  scopes:
    bot:
      - commands
      - chat:write
      - im:write
      - channels:read

settings:
  event_subscriptions:
    request_url: https://YOUR_NGROK_HOST/api/v1/slack/events
    bot_events:
      - app_uninstalled
      - tokens_revoked
      - app_home_opened
  interactivity:
    is_enabled: true
    request_url: https://YOUR_NGROK_HOST/api/v1/slack/interactive
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
