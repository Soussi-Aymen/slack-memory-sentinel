# Slack app manifest for the Cognee Slack integration (Path A).
#
# 1. Start a tunnel to the backend:
#      ngrok http 8000
#    Copy the https://<host>.ngrok-free.app hostname.
# 2. Replace every YOUR_NGROK_HOST below with that hostname (no scheme).
# 3. Create the app from this manifest at api.slack.com/apps.
# 4. Copy Client ID, Client Secret, and Signing Secret into .env
#    (SLACK_CLIENT_ID, SLACK_CLIENT_SECRET, SLACK_SIGNING_SECRET).
# 5. Set SLACK_REDIRECT_URI to
#    https://YOUR_NGROK_HOST/api/v1/integrations/slack/callback
#    (must byte-match redirect_urls below).
# 6. Set SLACK_FRONTEND_BASE_URL=http://localhost:8000
#    and INTEGRATION_CREDENTIALS_KEY to a 32-byte base64 secret.
# 7. Restart the backend, open /integrations, click Connect Slack,
#    then in Slack run /cognee-link and /cognee-ask.

display_information:
  name: Cognee
  description: Ask questions, save messages, and recall your team's shared memory — right from Slack.
  long_description: >-
    Cognee turns your Slack workspace into a front door for your team's knowledge
    graph. Ask it a question with /cognee-ask and get an answer pulled straight
    from what your team already knows — reviewed privately before anything is
    shared with the channel. Save an important message to memory in one click
    with the "Remember this" shortcut. Every teammate links their own Cognee
    account with /cognee-link, so answers and saved messages are always
    personal, never mixed up with someone else's.
  background_color: "#6510F4"

features:
  bot_user:
    display_name: cognee
    always_online: true
  app_home:
    home_tab_enabled: true
    messages_tab_enabled: true
  slash_commands:
    - command: /cognee-ask
      url: https://YOUR_NGROK_HOST/api/v1/slack/commands
      description: Ask your Cognee memory a question — reviewed privately before you share it
      usage_hint: what do we know about the Q3 launch?
    - command: /cognee-remember
      url: https://YOUR_NGROK_HOST/api/v1/slack/commands
      description: Save a decision or fact worth keeping — for things Slack never saw
      usage_hint: we chose Neon for v2, branching is cheaper
    - command: /cognee-link
      url: https://YOUR_NGROK_HOST/api/v1/slack/commands
      description: Get a private link to connect this Slack account to your own Cognee memory
  shortcuts:
    - name: Remember this
      type: message
      callback_id: remember_this
      description: Save this message to your own Cognee memory, tagged with who said it and where

oauth_config:
  redirect_urls:
    - https://YOUR_NGROK_HOST/api/v1/integrations/slack/callback
  scopes:
    bot:
      - commands
      - chat:write
      - im:write
      - channels:read

settings:
  event_subscriptions:
    request_url: https://YOUR_NGROK_HOST/api/v1/slack/events
    bot_events:
      - app_uninstalled
      - tokens_revoked
      - app_home_opened
  interactivity:
    is_enabled: true
    request_url: https://YOUR_NGROK_HOST/api/v1/slack/interactive
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
